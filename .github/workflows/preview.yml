# Preview of a branch: builds app/ like `deploy testnet` and uploads it as a Worker *version* (`wrangler versions
# upload`), which gets its own https://<id>-cmdk-app-testnet.<account>.workers.dev URL and leaves the traffic of
# https://testnet.cmdk.fi untouched. The URL goes to the job summary and, for a pull request, into a comment.
# A preview serves layout and the sandbox only: the relayer's CORS list names exact origins, so live calls from a
# preview origin are refused (the app shows them as unavailable). Secrets are those of `deploy testnet`.
name: preview
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  preview:
    # pull requests from forks have no secrets; nothing to upload with
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - name: Deployment manifest from cmdkfi/app (main)
        run: |
          mkdir -p deployments
          curl -fsSL https://raw.githubusercontent.com/cmdkfi/app/main/deployments/testnet.json -o deployments/testnet.json
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm build
        working-directory: app
      - name: Upload a preview version
        id: upload
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions upload --message "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} ${GITHUB_SHA::7}" | tee upload.log
          url=$(grep -o 'https://[a-z0-9.-]*\.workers\.dev' upload.log | head -1)
          test -n "$url" || { echo "no preview URL in wrangler's output (are preview URLs enabled for the worker?)"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview of \`${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}: $url (layout and sandbox; live relayer calls are refused from a preview origin)" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "Preview of ${GITHUB_SHA::7}: ${{ steps.upload.outputs.url }} (layout and the sandbox; live relayer calls are refused from a preview origin, so the live flow is reviewed on testnet.cmdk.fi after the merge)"
