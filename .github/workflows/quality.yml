name: frontend quality
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      visual_baselines:
        description: 'Only produce the linux screenshot baselines (Phase 9) as an artifact; skip the checks'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: frontend-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: ${{ !inputs.visual_baselines }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.7.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml}
      - name: Read public testnet manifest
        run: |
          mkdir -p deployments
          curl --retry 2 -fsSL https://raw.githubusercontent.com/cmdkfi/app/main/deployments/testnet.json -o deployments/testnet.json
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm build
        working-directory: app
      - run: pnpm test
        working-directory: app
      - run: pnpm test:bundle-boundary
        working-directory: app
      - name: Playwright browser cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - name: Install test browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        # Only the browser binary, from Playwright's CDN; the runner image ships Google Chrome, so the system
        # libraries are already there. No apt: its mirrors were unreachable from the runners all afternoon on 11 Nov 2026.
        run: pnpm exec playwright install chromium
        working-directory: app
      - name: Desktop browser scenarios
        run: pnpm test:browser
        working-directory: app
      - name: Browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            app/test-results/
            app/playwright-report/
          retention-days: 7

  # Phase 9: the linux baselines of app/e2e/visual.spec.ts, on this job's runner, Node, pnpm and steps. Run by hand on a
  # branch after a deliberate visual change (visual_baselines: true); the artifact is reviewed and committed to
  # app/e2e/__screenshots__/linux/. Nothing is pushed from here.
  visual-baselines:
    if: ${{ inputs.visual_baselines }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.7.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml}
      - name: Read public testnet manifest
        run: |
          mkdir -p deployments
          curl --retry 2 -fsSL https://raw.githubusercontent.com/cmdkfi/app/main/deployments/testnet.json -o deployments/testnet.json
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm build
        working-directory: app
      - name: Playwright browser cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
      - name: Install test browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        # Only the browser binary, from Playwright's CDN; the runner image ships Google Chrome, so the system
        # libraries are already there. No apt: its mirrors were unreachable from the runners all afternoon on 11 Nov 2026.
        run: pnpm exec playwright install chromium
        working-directory: app
      - name: Screenshot baselines
        run: pnpm exec playwright test e2e/visual.spec.ts --update-snapshots=all
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: app/e2e/__screenshots__/linux/
          if-no-files-found: error
          retention-days: 7
